<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Create Listing | Yangisi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#404754",
                    "outline-variant": "#c3c6d7",
                    "inverse-on-surface": "#f0f0fb",
                    "surface-container-high": "#e7e7f3",
                    "inverse-primary": "#b4c5ff",
                    "primary-container": "#2563eb",
                    "secondary-fixed": "#dce2f3",
                    "on-primary-container": "#eeefff",
                    "on-background": "#191b23",
                    "primary": "#004ac6",
                    "on-tertiary-fixed": "#360f00",
                    "on-secondary-fixed": "#151c27",
                    "surface-container-highest": "#e1e2ed",
                    "secondary": "#585f6c",
                    "surface": "#faf8ff",
                    "surface-dim": "#d9d9e5",
                    "tertiary-container": "#bc4800",
                    "on-surface": "#191b23",
                    "tertiary-fixed-dim": "#ffb596",
                    "on-error": "#ffffff",
                    "surface-variant": "#e1e2ed",
                    "on-error-container": "#93000a",
                    "surface-container": "#ededf9",
                    "on-secondary-container": "#5e6572",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f3f3fe",
                    "outline": "#737686",
                    "secondary-fixed-dim": "#c0c7d6",
                    "background": "#faf8ff",
                    "on-tertiary-container": "#ffede6",
                    "primary-fixed-dim": "#b4c5ff",
                    "primary-fixed": "#dbe1ff",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#943700",
                    "on-primary-fixed-variant": "#003ea8",
                    "error": "#ba1a1a",
                    "surface-bright": "#faf8ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "secondary-container": "#dce2f3",
                    "on-surface-variant": "#434655",
                    "on-primary": "#ffffff",
                    "surface-tint": "#0053db",
                    "tertiary-fixed": "#ffdbcd",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#2e3039",
                    "on-primary-fixed": "#00174b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "gutter": "16px",
                    "margin-desktop": "24px",
                    "margin-mobile": "16px",
                    "stack-lg": "24px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-xl": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-xl-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-xl-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface-container-low text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile py-stack-sm h-16">
<div class="flex items-center gap-4">
<button aria-label="Back" class="hover:bg-surface-container transition-colors p-2 rounded-full active:opacity-80 scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary">Create Listing</h1>
</div>
<button class="hover:bg-surface-container transition-colors p-2 rounded-full active:opacity-80 scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</header>
<main class="pt-20 pb-32 px-margin-mobile max-w-2xl mx-auto space-y-stack-lg">
<!-- Add Photos Area -->
<section>
<h2 class="text-label-md font-label-md text-outline uppercase mb-stack-sm px-1">Photos</h2>
<div class="grid grid-cols-3 gap-3">
<div class="col-span-3 aspect-video rounded-xl bg-surface-container-highest border-2 border-dashed border-outline-variant flex flex-col items-center justify-center cursor-pointer hover:bg-surface-variant/20 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[48px] text-primary mb-2" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
<p class="text-body-md font-body-md text-on-surface-variant">Add main photo</p>
<p class="text-label-md font-label-md text-outline mt-1">Maximum 10 photos</p>
</div>
<div class="aspect-square rounded-xl bg-surface-container flex items-center justify-center border border-outline-variant/30">
<span class="material-symbols-outlined text-outline">add</span>
</div>
<div class="aspect-square rounded-xl bg-surface-container flex items-center justify-center border border-outline-variant/30">
<span class="material-symbols-outlined text-outline">add</span>
</div>
<div class="aspect-square rounded-xl bg-surface-container flex items-center justify-center border border-outline-variant/30">
<span class="material-symbols-outlined text-outline">add</span>
</div>
</div>
</section>
<!-- General Info Section -->
<section class="space-y-stack-md">
<div>
<label class="text-label-md font-label-md text-outline px-1">Title</label>
<input class="w-full mt-1 bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="e.g. iPhone 15 Pro Max 256GB" type="text">
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="text-label-md font-label-md text-outline px-1">Brand</label>
<div class="relative mt-1">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-body-lg appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option>Apple</option>
<option>Samsung</option>
<option>Xiaomi</option>
<option>Google</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<div>
<label class="text-label-md font-label-md text-outline px-1">Model</label>
<div class="relative mt-1">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-body-lg appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option>iPhone 15 Pro Max</option>
<option>iPhone 15 Pro</option>
<option>iPhone 15</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 pointer-events-none text-outline">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Condition Tabs -->
<section>
<label class="text-label-md font-label-md text-outline px-1 block mb-2">Condition</label>
<div class="flex p-1 bg-surface-container-high rounded-xl">
<button class="flex-1 py-2 text-label-md font-label-md rounded-lg transition-all bg-primary text-on-primary shadow-sm cond-tab" onclick="toggleActive(this, 'cond')">New</button>
<button class="flex-1 py-2 text-label-md font-label-md rounded-lg transition-all text-on-surface-variant hover:bg-surface-variant/30 cond-tab" onclick="toggleActive(this, 'cond')">Used</button>
</div>
</section>
<!-- Pricing Section -->
<section>
<label class="text-label-md font-label-md text-outline px-1">Price</label>
<div class="flex mt-1 gap-2">
<div class="relative flex-grow">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-body-lg font-bold focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="0" type="number">
</div>
<div class="flex p-1 bg-surface-container-high rounded-xl shrink-0">
<button class="px-4 py-2 text-label-sm font-label-sm rounded-lg transition-all bg-primary text-on-primary curr-tab" onclick="toggleCurrency(this)">UZS</button>
<button class="px-4 py-2 text-label-sm font-label-sm rounded-lg transition-all text-on-surface-variant hover:bg-surface-variant/30 curr-tab" onclick="toggleCurrency(this)">USD</button>
</div>
</div>
</section>
<!-- Technical Specs (Chips) -->
<section class="space-y-stack-md">
<div>
<label class="text-label-md font-label-md text-outline px-1 block mb-2">Memory</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-primary text-on-primary text-label-md font-label-md mem-chip border border-transparent" onclick="chipSelect(this, 'mem')">128 GB</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 mem-chip" onclick="chipSelect(this, 'mem')">256 GB</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 mem-chip" onclick="chipSelect(this, 'mem')">512 GB</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 mem-chip" onclick="chipSelect(this, 'mem')">1 TB</button>
</div>
</div>
<div>
<label class="text-label-md font-label-md text-outline px-1 block mb-2">RAM</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 ram-chip" onclick="chipSelect(this, 'ram')">6 GB</button>
<button class="px-4 py-2 rounded-full bg-primary text-on-primary text-label-md font-label-md ram-chip border border-transparent" onclick="chipSelect(this, 'ram')">8 GB</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 ram-chip" onclick="chipSelect(this, 'ram')">12 GB</button>
</div>
</div>
<div>
<label class="text-label-md font-label-md text-outline px-1 block mb-2">Color</label>
<div class="flex flex-wrap gap-2">
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-primary text-on-primary text-label-md font-label-md col-chip border border-transparent" onclick="chipSelect(this, 'col')">
<span class="w-3 h-3 rounded-full bg-black border border-white/20"></span> Black
                    </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 col-chip" onclick="chipSelect(this, 'col')">
<span class="w-3 h-3 rounded-full bg-slate-300"></span> Natural Titanium
                    </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant text-label-md font-label-md border border-outline-variant hover:bg-surface-variant/20 col-chip" onclick="chipSelect(this, 'col')">
<span class="w-3 h-3 rounded-full bg-blue-100"></span> Blue
                    </button>
</div>
</div>
</section>
<!-- Sliders & Toggles -->
<section class="space-y-stack-md bg-surface p-4 rounded-xl border border-outline-variant/30">
<div>
<div class="flex justify-between items-center mb-2 px-1">
<label class="text-label-md font-label-md text-on-surface">Battery health</label>
<span class="text-label-md font-label-md text-primary font-bold" id="battery-val">98%</span>
</div>
<input class="w-full h-2 bg-surface-container-high rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="50" oninput="document.getElementById('battery-val').innerText = this.value + '%'" type="range" value="98">
</div>
<hr class="border-outline-variant/20">
<div class="flex items-center justify-between">
<div>
<h4 class="text-body-md font-body-md font-semibold">Warranty available</h4>
<p class="text-label-md font-label-md text-outline">Official or store warranty</p>
</div>
<button class="w-12 h-6 bg-surface-container-highest rounded-full relative transition-colors" onclick="toggleSwitch(this)">
<div class="w-5 h-5 bg-white rounded-full absolute left-0.5 top-0.5 shadow-sm transition-transform"></div>
</button>
</div>
<div class="flex items-center justify-between">
<div>
<h4 class="text-body-md font-body-md font-semibold">Installment (Bo'lib to'lash)</h4>
<p class="text-label-md font-label-md text-outline">Offer monthly payment options</p>
</div>
<button class="w-12 h-6 bg-surface-container-highest rounded-full relative transition-colors" onclick="toggleSwitch(this)">
<div class="w-5 h-5 bg-white rounded-full absolute left-0.5 top-0.5 shadow-sm transition-transform"></div>
</button>
</div>
<div class="flex items-center justify-between">
<div>
<h4 class="text-body-md font-body-md font-semibold">Exchange (Obmen)</h4>
<p class="text-label-md font-label-md text-outline">Willing to swap devices</p>
</div>
<button class="w-12 h-6 bg-primary rounded-full relative transition-colors" onclick="toggleSwitch(this)">
<div class="w-5 h-5 bg-white rounded-full absolute left-[calc(100%-22px)] top-0.5 shadow-sm transition-transform"></div>
</button>
</div>
</section>
<!-- Location & Description -->
<section class="space-y-stack-md">
<div>
<label class="text-label-md font-label-md text-outline px-1">Region &amp; City</label>
<div class="relative mt-1">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-body-lg appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option>Tashkent City</option>
<option>Samarkand</option>
<option>Bukhara</option>
<option>Andijan</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 pointer-events-none text-outline">location_on</span>
</div>
</div>
<div>
<label class="text-label-md font-label-md text-outline px-1">Description</label>
<textarea class="w-full mt-1 bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" placeholder="Describe the condition, scratches, or any additional features..." rows="4"></textarea>
</div>
</section>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-lg px-margin-mobile py-4 pb-safe border-t border-outline-variant/10 z-50">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md shadow-lg shadow-primary/20 active:scale-95 transition-all">
            Publish Listing
        </button>
</div>
<script>
        function toggleActive(btn, group) {
            const tabs = document.querySelectorAll(`.${group}-tab`);
            tabs.forEach(t => {
                t.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
                t.classList.add('text-on-surface-variant');
            });
            btn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
            btn.classList.remove('text-on-surface-variant');
        }

        function toggleCurrency(btn) {
            const tabs = document.querySelectorAll('.curr-tab');
            tabs.forEach(t => {
                t.classList.remove('bg-primary', 'text-on-primary');
                t.classList.add('text-on-surface-variant');
            });
            btn.classList.add('bg-primary', 'text-on-primary');
            btn.classList.remove('text-on-surface-variant');
        }

        function chipSelect(btn, group) {
            const chips = document.querySelectorAll(`.${group}-chip`);
            chips.forEach(c => {
                c.classList.remove('bg-primary', 'text-on-primary', 'border-transparent');
                c.classList.add('bg-surface-container-lowest', 'text-on-surface-variant', 'border-outline-variant');
            });
            btn.classList.add('bg-primary', 'text-on-primary', 'border-transparent');
            btn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant', 'border-outline-variant');
        }

        function toggleSwitch(btn) {
            const dot = btn.querySelector('div');
            if (btn.classList.contains('bg-primary')) {
                btn.classList.replace('bg-primary', 'bg-surface-container-highest');
                dot.classList.replace('left-[calc(100%-22px)]', 'left-0.5');
            } else {
                btn.classList.replace('bg-surface-container-highest', 'bg-primary');
                dot.classList.replace('left-0.5', 'left-[calc(100%-22px)]');
            }
        }
    </script>


</body></html>
