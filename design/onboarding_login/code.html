<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Yangisi - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#404754",
                        "outline-variant": "#c3c6d7",
                        "inverse-on-surface": "#f0f0fb",
                        "surface-container-high": "#e7e7f3",
                        "inverse-primary": "#b4c5ff",
                        "primary-container": "#2563eb",
                        "secondary-fixed": "#dce2f3",
                        "on-primary-container": "#eeefff",
                        "on-background": "#191b23",
                        "primary": "#004ac6",
                        "on-tertiary-fixed": "#360f00",
                        "on-secondary-fixed": "#151c27",
                        "surface-container-highest": "#e1e2ed",
                        "secondary": "#585f6c",
                        "surface": "#faf8ff",
                        "surface-dim": "#d9d9e5",
                        "tertiary-container": "#bc4800",
                        "on-surface": "#191b23",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-error": "#ffffff",
                        "surface-variant": "#e1e2ed",
                        "on-error-container": "#93000a",
                        "surface-container": "#ededf9",
                        "on-secondary-container": "#5e6572",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f3fe",
                        "outline": "#737686",
                        "secondary-fixed-dim": "#c0c7d6",
                        "background": "#faf8ff",
                        "on-tertiary-container": "#ffede6",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#943700",
                        "on-primary-fixed-variant": "#003ea8",
                        "error": "#ba1a1a",
                        "surface-bright": "#faf8ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "secondary-container": "#dce2f3",
                        "on-surface-variant": "#434655",
                        "on-primary": "#ffffff",
                        "surface-tint": "#0053db",
                        "tertiary-fixed": "#ffdbcd",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2e3039",
                        "on-primary-fixed": "#00174b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "margin-desktop": "24px",
                        "margin-mobile": "16px",
                        "stack-lg": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-xl": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-xl-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-xl-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}]

                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .otp-input:focus {
            border-color: #004ac6;
            box-shadow: 0 0 0 2px rgba(0, 74, 198, 0.1);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center px-margin-mobile">
<!-- Auth Container -->
<main class="w-full max-w-[400px] flex flex-col items-center" id="auth-container">
<!-- Logo Section -->
<header class="mb-stack-lg text-center">
<h1 class="text-primary font-headline-xl-mobile text-headline-xl-mobile mb-2">Yangisi</h1>
<p class="text-on-surface-variant font-body-md text-body-md">The trusted marketplace for mobile tech</p>
</header>
<!-- Step 1: Phone Number Input -->
<section class="w-full space-y-stack-lg fade-in" id="step-phone">
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center space-x-2 pointer-events-none">
<!-- Uzbekistan Flag SVG Placeholder as CSS Gradient -->
<div class="w-6 h-4 rounded-sm flex flex-col overflow-hidden border border-outline-variant">
<div class="h-1/3 bg-[#0099B5]"></div>
<div class="h-1/3 bg-white"></div>
<div class="h-1/3 bg-[#1EB53A]"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface-variant">+998</span>
</div>
<input class="w-full h-14 pl-[92px] pr-4 bg-surface-container-low border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-lg text-body-lg" id="phone" maxlength="12" placeholder="00 000 00 00" type="tel">
</div>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center" onclick="goToSms()">
                Continue
            </button>
<p class="text-center font-label-md text-label-md text-outline px-4">
                By continuing, you agree to our Terms of Service and Privacy Policy.
            </p>
</section>
<!-- Step 2: SMS Verification (Hidden by default) -->
<section class="w-full space-y-stack-lg hidden" id="step-sms">
<div class="text-center mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Verify Phone</h2>
<p class="font-body-md text-body-md text-on-surface-variant">We've sent a 5-digit code to <span class="font-bold text-primary" id="display-phone">+998 00 000 00 00</span></p>
</div>
<div class="flex justify-between items-center gap-2">
<input autofocus="" class="otp-input w-14 h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border border-outline-variant rounded-xl focus:outline-none transition-all" maxlength="1" type="number">
<input class="otp-input w-14 h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border border-outline-variant rounded-xl focus:outline-none transition-all" maxlength="1" type="number">
<input class="otp-input w-14 h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border border-outline-variant rounded-xl focus:outline-none transition-all" maxlength="1" type="number">
<input class="otp-input w-14 h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border border-outline-variant rounded-xl focus:outline-none transition-all" maxlength="1" type="number">
<input class="otp-input w-14 h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border border-outline-variant rounded-xl focus:outline-none transition-all" maxlength="1" type="number">
</div>
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center" onclick="verifySms()">
                Verify &amp; Login
            </button>
<div class="text-center">
<button class="font-label-md text-label-md text-primary hover:underline" onclick="resendCode()">
                    Resend code in 0:59
                </button>
</div>
<button class="w-full flex items-center justify-center gap-2 text-on-surface-variant font-label-md text-label-md mt-4" onclick="goBack()">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Change phone number
            </button>
</section>
</main>
<!-- Visual Decoration (Atmospheric) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<script>
        function goToSms() {
            const phoneVal = document.getElementById('phone').value;
            if(!phoneVal) {
                alert('Please enter your phone number');
                return;
            }
            
            document.getElementById('display-phone').innerText = '+998 ' + phoneVal;
            
            const stepPhone = document.getElementById('step-phone');
            const stepSms = document.getElementById('step-sms');
            
            stepPhone.classList.add('hidden');
            stepSms.classList.remove('hidden');
            stepSms.classList.add('fade-in');

            // Auto-focus first OTP input
            setTimeout(() => {
                document.querySelector('.otp-input').focus();
            }, 100);
        }

        function goBack() {
            const stepPhone = document.getElementById('step-phone');
            const stepSms = document.getElementById('step-sms');
            
            stepSms.classList.add('hidden');
            stepPhone.classList.remove('hidden');
            stepPhone.classList.add('fade-in');
        }

        function verifySms() {
            // Mock success interaction
            const btn = event.currentTarget;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span>`;
            setTimeout(() => {
                btn.innerHTML = `Success!`;
                btn.classList.replace('bg-primary', 'bg-green-600');
            }, 1500);
        }

        function resendCode() {
            console.log('Code resent');
        }

        // Auto-tab for OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>


</body></html>
