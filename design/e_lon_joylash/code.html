<script>
        // Simple Interaction logic for demo
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.classList.contains('border-outline-variant')) {
                    const parent = this.parentElement;
                    parent.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    });
                    this.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                }
            });
        });

        // Segmented control logic
        const segControl = document.querySelector('.bg-surface-container.rounded-xl.p-1');
        if (segControl) {
            segControl.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    segControl.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                        b.classList.add('text-on-surface-variant');
                    });
                    btn.classList.add('bg-white', 'shadow-sm', 'text-primary');
                    btn.classList.remove('text-on-surface-variant');
                });
            });
        }
