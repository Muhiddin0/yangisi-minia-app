<script>
        // Simple Interaction logic
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                if(icon && (icon.textContent === 'favorite')) {
                    const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                    icon.style.fontVariationSettings = `'FILL' ${isFilled ? 0 : 1}`;
                    icon.classList.add('scale-125');
                    setTimeout(() => icon.classList.remove('scale-125'), 200);
                }
            });
        });

        // Search focus interaction
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
