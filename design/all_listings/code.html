<script>
        // Micro-interactions for chips
        document.querySelectorAll('button.whitespace-nowrap').forEach(chip => {
            chip.addEventListener('click', () => {
                const isActive = chip.classList.contains('bg-primary');
                if (!isActive) {
                    // Reset siblings in the same group if needed, or just toggle
                    // Here we just toggle this one for demo
                    chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                    chip.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
                } else {
                    chip.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                    chip.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
                }
            });
        });

        // Simple heart toggle
        document.querySelectorAll('button .material-symbols-outlined').forEach(icon => {
            if (icon.innerText === 'favorite') {
                icon.parentElement.addEventListener('click', (e) => {
                    e.preventDefault();
                    const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                    icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
                    icon.parentElement.classList.toggle('text-error', !isFilled);
                });
            }
        });
    </script>
