<script>
        // Simple micro-interactions for inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Save button interaction
        const saveBtn = document.querySelector('button.bg-primary');
        saveBtn.addEventListener('click', () => {
            const originalContent = saveBtn.innerHTML;
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saqlanmoqda...';
            saveBtn.disabled = true;
            
            setTimeout(() => {
                saveBtn.innerHTML = '<span class="material-symbols-outlined">check</span> Saqlandi!';
                saveBtn.classList.replace('bg-primary', 'bg-tertiary-container');
                saveBtn.classList.replace('text-on-primary', 'text-on-tertiary-container');
                
                setTimeout(() => {
                    saveBtn.innerHTML = originalContent;
                    saveBtn.classList.replace('bg-tertiary-container', 'bg-primary');
                    saveBtn.classList.replace('text-on-tertiary-container', 'text-on-primary');
                    saveBtn.disabled = false;
                }, 2000);
            }, 1000);
        });
    </script>
